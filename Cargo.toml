[workspace]
members = [
    "crates/quickbridge",
    "crates/quickbridge-core",
    "crates/quickbridge-runtime",
    "crates/quickbridge-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/DG02002/quickbridge"
homepage = "https://github.com/DG02002/quickbridge"
documentation = "https://docs.rs/quickbridge"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.0.17"
axum = "0.8.6"
clap = { version = "4.5.48", features = ["derive", "wrap_help"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
insta = "1.43.2"
predicates = "3.1.3"
ratatui = "0.30.0"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
vt100 = "0.16.2"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard-style = "warn"

[workspace.lints.clippy]
await_holding_lock = "deny"
large_enum_variant = "deny"
needless_question_mark = "deny"
redundant_clone = "deny"
